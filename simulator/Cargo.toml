[package]
name = "simulator"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mev-sim"
path = "src/main.rs"

[dependencies]
amm-math = { path = "../crates/amm-math" }
clap = { version = "4", features = ["derive"] }
figment = { version = "0.10", features = ["toml", "env"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
csv = "1"
itertools = "0.13"
rayon = "1"
