[package]
name = "simulator"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mev-sim"
path = "src/main.rs"

[dependencies]
amm-math = { path = "../crates/amm-math" }
clap = { version = "4", features = ["derive"] }
figment = { version = "0.10", features = ["toml", "env"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
csv = "1"
itertools = "0.14"
rayon = "1"
serde_json = "1"
base64 = "0.22"
carbon-core = "0.12"
carbon-raydium-cpmm-decoder = "0.12"
