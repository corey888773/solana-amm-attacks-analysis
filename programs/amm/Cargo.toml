[package]
name = "amm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
anchor-lang = "1.0"
anchor-spl = "1.0"
amm-math = { path = "../../crates/amm-math" }

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
# LiteSVM dev-deps temporarily disabled due to upstream bug:
# solana-keypair 3.1.2 uses five8 decode API that got removed in five8 1.0
# (DecodeError no longer impls std::error::Error). Waiting for solana-sdk fix.

[lints.rust]
# Anchor 0.31.1 macros emit cfg checks and deprecated calls not under our control
deprecated = "allow"
unexpected_cfgs = { level = "allow", check-cfg = [
    'cfg(feature, values("anchor-debug", "custom-heap", "custom-panic", "no-idl", "no-log-ix-name"))',
    'cfg(target_os, values("solana"))',
] }
