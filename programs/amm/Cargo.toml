[package]
name = "amm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
anchor-lang = "1.0"
anchor-spl = "1.0"
amm-math = { path = "../../crates/amm-math" }

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []

[dev-dependencies]
litesvm = "0.11"
solana-sdk = "3"
solana-keypair = "3.1.2"
solana-signer = "3"
solana-pubkey = "3"
solana-transaction = "3"
solana-message = "3"
solana-system-interface = "2"

[lints.rust]
# Anchor 0.31.1 macros emit cfg checks and deprecated calls not under our control
deprecated = "allow"
unexpected_cfgs = { level = "allow", check-cfg = [
    'cfg(feature, values("anchor-debug", "custom-heap", "custom-panic", "no-idl", "no-log-ix-name"))',
    'cfg(target_os, values("solana"))',
] }
